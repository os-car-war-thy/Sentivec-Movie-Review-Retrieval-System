[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "sentivec-research"
version = "0.1.0"
description = "Reproducible experiments for sentiment-aware review retrieval"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {file = "LICENSE"}
dependencies = [
  "numpy==2.2.6",
  "pandas==2.3.3",
  "scipy==1.16.2",
  "scikit-learn==1.7.2",
  "faiss-cpu==1.12.0",
]

[project.optional-dependencies]
research = [
  "torch==2.8.0",
  "transformers==4.57.1",
  "sentence-transformers==5.1.2",
  "huggingface-hub==0.36.0",
  "sentencepiece==0.2.1",
  "vaderSentiment==3.3.2",
  "rank-bm25==0.2.2",
  "matplotlib==3.10.7",
  "kagglehub==0.3.13",
  "nbformat==5.10.4",
  "nbclient==0.10.2",
  "ipykernel==6.30.1",
  "Jinja2==3.1.6",
]
dev = ["pytest==8.4.2", "nbformat==5.10.4", "ruff==0.14.1", "rank-bm25==0.2.2", "Jinja2==3.1.6"]

[project.scripts]
sentivec = "sentivec.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
